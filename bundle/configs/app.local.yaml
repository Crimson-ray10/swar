# iTantra Local Application Configuration

server:
  host: "127.0.0.1"
  port: 8000
  reload: false
  cors_origins: ["http://localhost:5173", "http://127.0.0.1:5173"]
  max_upload_bytes: 16777216  # 16 MiB
  max_audio_duration_s: 30

storage:
  model_dir: "./models/cache"
  prompts_dir: "./models/prompts"
  runs_dir: "./runs"
  retain_runs: false

defaults:
  language: "hi"
  profile: "text_v1"
  wire_profile: "interactive_2"
  channel:
    mode: "bpsk_awgn"
    gross_rate_bps: 2000
    eb_n0_db: 5.0
    packet_loss_rate: 0.0
    base_latency_ms: 80
    jitter_ms_stddev: 25
    reorder_probability: 0.02
    seed: 1729
    real_time_pacing: true

logging:
  level: "INFO"
  redact_sensitive: true
