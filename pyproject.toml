[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "itantra"
version = "0.1.0"
description = "Indian Multilingual TTS & STT Aided Neural Transceiver Radio Access for Low-Bitrate Links"
authors = [{ name = "iTantra Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "soundfile>=0.12.1",
    "sentencepiece>=0.2.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "packages/protocol",
    "packages/engine",
    "services/api"
]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
where = ["packages/protocol", "packages/engine", "services/api"]
