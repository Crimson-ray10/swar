# iTantra Wire Profiles
# Rates: 0.5 kbps (ultra), 1 kbps (low), 2 kbps (interactive/default MVP), 4 kbps (robust), 8 & 16 kbps (baselines)

profiles:
  ultra_0p5:
    name: "ultra_0p5"
    gross_rate_bps: 500
    description: "Extreme constrained link (0.5 kbps), store-and-forward phrase mode"
    superframe_duration_s: 2.0
    max_tokens: 32
    fec_code_rate: "2/3"
    fec_scheme: "convolutional_xor43"
    target_serialization_s: 2.0
    allow_interleaving: true

  low_1:
    name: "low_1"
    gross_rate_bps: 1000
    description: "1.0 kbps constrained channel, short phrase turns"
    superframe_duration_s: 1.5
    max_tokens: 48
    fec_code_rate: "2/3"
    fec_scheme: "convolutional_xor43"
    target_serialization_s: 1.0
    allow_interleaving: true

  interactive_2:
    name: "interactive_2"
    gross_rate_bps: 2000
    description: "Default MVP operating point (2.0 kbps), 1-2s conversational clauses"
    superframe_duration_s: 1.0
    max_tokens: 64
    fec_code_rate: "2/3"
    fec_scheme: "convolutional_xor43"
    target_serialization_s: 0.5
    allow_interleaving: true

  robust_4:
    name: "robust_4"
    gross_rate_bps: 4000
    description: "4.0 kbps robust interactive test lane"
    superframe_duration_s: 0.8
    max_tokens: 96
    fec_code_rate: "1/2"
    fec_scheme: "convolutional_xor43"
    target_serialization_s: 0.25
    allow_interleaving: true

  audio_8:
    name: "audio_8"
    gross_rate_bps: 8000
    description: "8.0 kbps neural audio codec baseline comparison lane"
    superframe_duration_s: 0.5
    max_tokens: 128
    fec_code_rate: "2/3"
    fec_scheme: "none"
    target_serialization_s: 0.125
    allow_interleaving: false

  audio_16:
    name: "audio_16"
    gross_rate_bps: 16000
    description: "16.0 kbps Opus/EnCodec baseline comparison lane"
    superframe_duration_s: 0.5
    max_tokens: 256
    fec_code_rate: "1/1"
    fec_scheme: "none"
    target_serialization_s: 0.0625
    allow_interleaving: false
